name: Qt tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools xvfb

      - name: Configure tests
        run: |
          mkdir -p build-tests
          cd build-tests
          qmake6 ../tests/agenda_tests.pro

      - name: Build tests
        run: make -C build-tests -j2

      - name: Run tests
        env:
          QTEST_FUNCTION_TIMEOUT: 15000
        run: xvfb-run -a ./build-tests/agenda_tests -o test-results.txt,txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-test-results
          path: test-results.txt
          if-no-files-found: error
