name: Apply issue 48 UI refinements

on:
  push:
    branches:
      - feature/48-in-window-editing

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Repair helper tail
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_issue_48_ui_shortcuts_fix.py")
          text = path.read_text(encoding="utf-8")
          head = text.split("# resources/style.qss", 1)[0]
          tail = '''# resources/style.qss
          path = "resources/style.qss"
          text = read(path)
          text = replace_once(
              text,
              "QPushButton#primaryButton:disabled,\\n"
              "QPushButton#dangerButton:disabled {\\n"
              "    background-color: #e0e0e0;\\n"
              "    color: #888888;\\n"
              "    border: 1px solid #cfcfcf;\\n"
              "}\\n\\n",
              "QPushButton#accentButton:disabled,\\n"
              "QPushButton#primaryButton:disabled,\\n"
              "QPushButton#dangerButton:disabled {\\n"
              "    background-color: #e0e0e0;\\n"
              "    color: #888888;\\n"
              "    border: 1px solid #cfcfcf;\\n"
              "}\\n\\n"
              "QPushButton#accentButton[workflowActive=\\\"true\\\"],\\n"
              "QPushButton#accentButton[workflowActive=\\\"true\\\"]:disabled,\\n"
              "QPushButton#primaryButton[workflowActive=\\\"true\\\"],\\n"
              "QPushButton#primaryButton[workflowActive=\\\"true\\\"]:disabled {\\n"
              "    background-color: #3F51B5;\\n"
              "    color: #ffffff;\\n"
              "    border: 1px solid #303F9F;\\n"
              "    font-weight: 600;\\n"
              "}\\n\\n",
              "disabled and active workflow button styling",
          )
          write(path, text)

          print("Issue 48 UI and keyboard refinements applied.")
          '''
          path.write_text(head + tail, encoding="utf-8")
          PY

      - name: Apply refinements
        run: python3 scripts/apply_issue_48_ui_shortcuts_fix.py

      - name: Build application
        run: |
          mkdir build
          cd build
          qmake6 ../agenda_qt.pro
          make -j2

      - name: Commit implementation
        run: |
          rm -rf build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_issue_48_ui_shortcuts_fix.py
          git rm .github/workflows/apply-issue-48-refinements.yml
          git add -A
          git commit -m "Polish in-window activity workflows and shortcuts"
          git push origin HEAD:feature/48-in-window-editing
