name: Apply issue 65 monthly overview

on:
  push:
    branches:
      - feature/65-monthly-activity-overview

permissions:
  contents: write

jobs:
  apply-build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Apply monthly overview integration
        run: python3 scripts/apply_issue_65_month_overview.py

      - name: Build application
        run: |
          mkdir build
          cd build
          qmake6 ../agenda_qt.pro
          make -j2

      - name: Commit implementation
        run: |
          rm -rf build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_issue_65_month_overview.py
          git rm .github/workflows/apply-issue-65-month-overview.yml
          git add -A
          git commit -m "Add monthly activity overview and date filtering"
          git push origin HEAD:feature/65-monthly-activity-overview
