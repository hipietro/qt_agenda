name: Apply issue 48 UI refinements

on:
  push:
    branches:
      - feature/48-in-window-editing

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Apply refinements
        run: python3 scripts/apply_issue_48_ui_fixes.py

      - name: Build application
        run: |
          mkdir build
          cd build
          qmake6 ../agenda_qt.pro
          make -j2

      - name: Commit refinements
        run: |
          rm -rf build
          git rm scripts/apply_issue_48_ui_fixes.py
          git rm .github/workflows/apply-issue-48-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine in-window activity forms and shortcuts"
          git push origin HEAD:feature/48-in-window-editing
